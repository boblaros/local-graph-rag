entity_resolution:
  version: corpus-native-merge-only-er-v8
  config_version: "8.0.0"
  # Fixed before the main run without using its QA results.
  decision_policy:
    version: expert-fixed-v1
    reject_below_score: 0.50
    auto_merge_at_score: 0.76
    judge_candidate_method: reciprocal_embedding_neighbour
    judge_mutual_top_k: 1
    max_judge_calls_per_run: 650
  # Candidate-retrieval boundary, not a merge/reject score boundary.
  fuzzy_candidate_threshold: 0.70
  containment_min_chars: 4
  max_block_size: 200
  embedding_neighbor_k: 3
  embedding_lsh_tables: 4
  embedding_lsh_bits: 10
  embedding_lsh_max_bucket: 200
  candidate_methods:
    - exact_name
    - containment
    - fuzzy_name
    - acronym
    - embedding_neighbour
    - reciprocal_embedding_neighbour
  signal_weights:
    name_exact: 0.24
    lexical: 0.15
    acronym: 0.09
    containment: 0.08
    description: 0.12
    embedding: 0.12
    type: 0.08
    neighbourhood: 0.05
    relation_context: 0.04
    provenance: 0.01
    frequency: 0.01
    source_diversity: 0.01

relation_recovery:
  version: evidence-bound-relation-recovery-v1
  config_version: "1.0.0"
  candidate_policy_version: same-chunk-missing-canonical-pair-v1
  require_exact_evidence_quote: true
  include_existing_local_relations: true
  max_calls_per_chunk: 1
  retry_count: 0

# Storage policy for the derived graphs. See LIGHTRAG_PARITY.md.
graph_materialization:
  missing_description_policy: preserve_with_audited_placeholders

graph_regimes:
  - native_lightrag
  - advanced_lightrag_er
  - advanced_lightrag_er_rr

runtime:
  runs_root: ../runs
  minimum_free_disk_gib: 5.0
  artifact_schema_version: "2.0.0"
  ollama_host: http://localhost:11434
  model_timeout_seconds: 900
  # Allows all pairs already admitted by the fixed ER rule to be evaluated.
  er_judge_budget_overrides:
    qwen3_8b:
      max_judge_calls_per_run: 1000
      reason: >-
        The initial 650-call planning estimate was non-binding for the other
        eleven builders, but qwen3_8b deterministically admitted 824 pairs.
        The override permits those same admitted pairs to be judged without
        changing ER decision semantics.
  lightrag:
    provider: ollama
    embedding_provider: ollama
    llm_timeout_seconds: 900
    max_extract_input_tokens: 8192
    index_batch_size: 1
    storage:
      kv_storage: JsonKVStorage
      vector_storage: NanoVectorDBStorage
      graph_storage: NetworkXStorage
      doc_status_storage: JsonDocStatusStorage
    tiktoken_model_name: gpt-4o-mini
    embedding_func_max_async: 1
    kg_linked_chunk_selection: WEIGHT
    enable_llm_cache: false
    enable_llm_cache_for_entity_extract: false
    embedding_cache:
      enabled: false
      similarity_threshold: 0.95
      use_llm_check: false
  retrieval:
    mode: hybrid
    top_k: 20
    chunk_top_k: 20
    max_entity_tokens: 2048
    max_relation_tokens: 3072
    max_total_tokens: 7000
    enable_rerank: false
    timeout_seconds: 900

metadata:
  full_experiment_authorized: false
